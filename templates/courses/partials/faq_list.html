<div class="space-y-2">
  {% for f in faqs %}
  <details class="panel !p-4 group">
    <summary class="font-bold cursor-pointer list-none flex justify-between gap-3">{{ f.question }}<span class="text-slate-400 group-open:rotate-45 transition">＋</span></summary>
    <p class="mt-3 text-slate-600 dark:text-slate-300 leading-8">{{ f.answer|linebreaksbr }}</p>
  </details>
  {% empty %}<p class="text-slate-500">هنوز سؤالی ثبت نشده است.</p>{% endfor %}
</div>
