{% extends "panel/base.html" %}
{% load school %}
{% block panel %}
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
  <h1 class="text-xl font-extrabold">{{ quiz.title }}</h1>
  {% if attempt.deadline %}<div class="pill !text-sm !px-4 !py-1.5" data-countdown="{{ attempt.deadline.isoformat }}">⏱️ <span data-countdown-text></span></div>{% endif %}
</div>
<form method="post" id="quiz-form" class="space-y-4">
  {% csrf_token %}
  {% for q in questions %}
  <fieldset class="card p-5">
    <legend class="font-bold leading-8"><span class="text-slate-500">{{ forloop.counter|fa_digits }}.</span> {{ q.text }}</legend>
    <div class="mt-3 space-y-2">
      {% for c in q.choices.all %}
      <label class="flex items-start gap-3 rounded-xl px-3 py-2 cursor-pointer hover:bg-white/70 dark:hover:bg-slate-800/70">
        <input type="radio" name="q{{ q.pk }}" value="{{ c.pk }}" class="mt-1.5"><span>{{ c.text }}</span>
      </label>
      {% endfor %}
    </div>
  </fieldset>
  {% endfor %}
  <button class="btn-primary" onclick="return confirm('پاسخ‌ها ثبت و آزمون پایان یابد؟')">ثبت پاسخ‌ها</button>
</form>
{% endblock %}
